<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning — Lac de Podensac</title>
  <style>
    :root {
      --primary: #3d8a80; --primary-dark: #2a6059; --accent: #e8951e;
      --white: #fff; --bg: #f4f6f5; --border: #e0e6e4; --gray: #7a8e8b;
      --font: 'Segoe UI', system-ui, sans-serif;
      --card-shadow: 0 2px 12px rgba(42,96,89,0.10);
      --planning-label-w: 80px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: #1a2b29; min-height: 100vh; }

    /* ── PIN SCREEN ── */
    #pin-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--primary-dark);
    }
    .pin-box {
      background: var(--white); border-radius: 20px; padding: 40px 32px;
      width: 320px; box-shadow: 0 8px 40px rgba(0,0,0,0.2); text-align: center;
    }
    .pin-logo { font-size: 2.4rem; margin-bottom: 8px; }
    .pin-title { font-size: 1.15rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 4px; }
    .pin-sub { font-size: 0.82rem; color: var(--gray); margin-bottom: 24px; }
    .pin-input {
      width: 100%; padding: 14px 16px; font-size: 1.5rem; letter-spacing: 0.3em;
      text-align: center; border: 2px solid var(--border); border-radius: 12px;
      margin-bottom: 12px; outline: none;
    }
    .pin-input:focus { border-color: var(--primary); }
    .pin-btn {
      width: 100%; padding: 13px; background: var(--primary); color: #fff;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .pin-btn:hover { background: var(--primary-dark); }
    .pin-error { color: #c0392b; font-size: 0.82rem; margin-top: 8px; min-height: 18px; }

    /* ── APP ── */
    #app { display: none; }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--primary-dark); height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
    }
    .nav-title { color: #fff; font-size: 1rem; font-weight: 800; }
    .nav-title span { font-weight: 400; opacity: 0.65; font-size: 0.8rem; margin-left: 8px; }
    .nav-right { display: flex; gap: 8px; align-items: center; }
    .btn-back { color: rgba(255,255,255,0.75); font-size: 0.78rem; text-decoration: none; }
    .btn-pin-out {
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      padding: 5px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer;
    }

    .cal-wrap { padding: 16px; max-width: 1400px; margin: 0 auto; }

    /* ── CAL HEADER ── */
    .cal-header {
      background: var(--white); border-radius: 14px;
      padding: 12px 16px; margin-bottom: 14px;
      box-shadow: var(--card-shadow);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
    }
    .cal-nav { display: flex; align-items: center; gap: 8px; }
    .cal-nav-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg); cursor: pointer; font-size: 1.1rem; color: var(--primary-dark);
    }
    .cal-today-btn {
      padding: 5px 12px; border: none; border-radius: 20px;
      background: var(--bg); font-size: 0.78rem; font-weight: 700;
      color: var(--primary-dark); cursor: pointer;
    }
    .cal-period { font-weight: 800; font-size: 0.95rem; color: var(--primary-dark); }
    .cal-view-tabs { display: flex; gap: 4px; }
    .cal-view-tab {
      padding: 5px 12px; border-radius: 20px; border: none;
      background: none; font-size: 0.78rem; font-weight: 600; cursor: pointer;
      color: var(--gray); transition: all .15s;
    }
    .cal-view-tab.active { background: var(--primary); color: #fff; }

    #cal-container { background: var(--white); border-radius: 14px; box-shadow: var(--card-shadow); overflow: hidden; }

    /* ── PLANNING ── */
    .cal-planning-outer { display: flex; flex-direction: column; }
    .cal-planning-sticky-header {
      position: sticky; top: 56px; z-index: 10;
      display: flex; background: var(--white);
      border-bottom: 2px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
    }
    .cal-planning-sticky-label {
      flex-shrink: 0; width: var(--planning-label-w);
      border-right: 2px solid var(--border); background: var(--white);
    }
    .cal-planning-sticky-scroll { overflow: hidden; flex: 1; min-width: 0; }
    .cal-planning-sticky-scroll .cal-planning-row { border-bottom: none; }
    .cal-planning-body-wrap { display: flex; }
    .cal-planning-labels-col {
      flex-shrink: 0; width: var(--planning-label-w);
      border-right: 2px solid var(--border); background: var(--white); position: relative;
    }
    .cal-planning-resize-handle {
      position: absolute; right: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 10;
    }
    .cal-planning-resize-handle::after {
      content: ''; position: absolute; left: 4px; top: 20%; bottom: 20%;
      width: 2px; background: var(--border); border-radius: 2px; opacity: 0; transition: opacity .15s;
    }
    .cal-planning-resize-handle:hover::after, .cal-planning-resize-handle.dragging::after { opacity: 1; }
    .cal-planning-scroll-col { overflow-x: auto; flex: 1; min-width: 0; }
    .cal-planning-row { display: flex; border-bottom: 1px solid var(--border); min-height: 40px; }
    .cal-planning-row:last-child { border-bottom: none; }
    .cal-planning-label {
      width: var(--planning-label-w); min-width: var(--planning-label-w); min-height: 40px;
      border-bottom: 1px solid var(--border); padding: 0 7px;
      display: flex; align-items: center; gap: 4px;
      font-size: 0.72rem; font-weight: 600; color: var(--primary-dark); background: var(--white);
    }
    .cal-planning-labels-col .cal-planning-label:last-child { border-bottom: none; }
    .cal-planning-label.section-head {
      background: rgba(42,96,89,0.04); font-size: 0.62rem; font-weight: 800;
      text-transform: uppercase; color: var(--primary); letter-spacing: 0.06em;
    }
    .cal-planning-timeline {
      position: relative; display: flex; flex-shrink: 0; min-height: 40px; overflow: visible;
    }
    .cal-planning-day-col {
      flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column;
    }
    .cal-planning-day-col.weekend { background: rgba(220,100,20,0.04); }
    .cal-planning-day-col.today-col { background: rgba(61,138,128,0.08); }
    .cal-planning-day-header-cell {
      text-align: center; padding: 4px 0 3px;
      font-size: 0.6rem; font-weight: 700; line-height: 1.3; color: var(--gray);
    }
    .cal-planning-day-col.weekend .cal-planning-day-header-cell { color: #c05000; }
    .cal-planning-day-col.today-col .cal-planning-day-header-cell { color: var(--primary); font-weight: 800; }
    .cal-planning-block {
      position: absolute; top: 5px; height: 28px;
      border-radius: 5px; padding: 0 7px;
      font-size: 0.62rem; font-weight: 700;
      display: flex; align-items: center;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      cursor: pointer; border: none; text-align: left;
    }
    .cal-planning-block:hover { opacity: 0.85; }

    /* ── MONTH VIEW ── */
    .cal-month-grid { padding: 8px; }
    .cal-month-dow-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 4px; }
    .cal-month-dow { text-align: center; font-size: 0.65rem; font-weight: 700; color: var(--gray); padding: 4px 0; }
    .cal-month-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-month-cell {
      min-height: 70px; border-radius: 8px; padding: 4px;
      background: var(--bg); border: 1px solid transparent;
    }
    .cal-month-cell.today { border-color: var(--primary); background: rgba(61,138,128,0.06); }
    .cal-month-cell.other-month { opacity: 0.35; }
    .cal-day-num { font-size: 0.7rem; font-weight: 700; color: var(--gray); margin-bottom: 2px; }
    .cal-month-cell.today .cal-day-num { color: var(--primary); }
    .cal-event-chip {
      display: block; width: 100%; text-align: left;
      font-size: 0.6rem; font-weight: 600; padding: 2px 5px; border-radius: 4px;
      border: none; cursor: pointer; margin-bottom: 2px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .cal-more-link { font-size: 0.6rem; color: var(--gray); background: none; border: none; cursor: pointer; padding: 0; }

    /* ── WEEK VIEW ── */
    .cal-week-scroll { overflow-x: auto; }
    .cal-week-grid { display: grid; grid-template-columns: repeat(7,1fr); min-width: 560px; }
    .cal-week-col { border-right: 1px solid var(--border); min-height: 300px; }
    .cal-week-col:last-child { border-right: none; }
    .cal-week-col.today-col .cal-week-col-header { border-bottom-color: var(--primary); }
    .cal-week-col-header { padding: 8px 6px; border-bottom: 2px solid var(--border); background: var(--white); }
    .cal-week-dow { font-size: 0.62rem; font-weight: 700; color: var(--gray); }
    .cal-week-day-num { font-size: 1.1rem; font-weight: 800; color: var(--primary-dark); }
    .cal-week-day-num.today { color: var(--primary); }
    .cal-week-col-events { padding: 6px 4px; }
    .cal-week-event {
      display: block; width: 100%; text-align: left; border: none; border-radius: 6px;
      padding: 5px 7px; margin-bottom: 4px; cursor: pointer; font-size: 0.7rem;
    }
    .cal-week-event-name { font-weight: 700; }

    /* ── LEGEND ── */
    .cal-legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 10px 14px; font-size: 0.72rem; color: var(--gray);
      border-top: 1px solid var(--border);
    }
    .cal-legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

    /* ── DETAIL MODAL ── */
    .detail-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
      align-items: center; justify-content: center;
    }
    .detail-overlay.open { display: flex; }
    .detail-modal {
      background: var(--white); border-radius: 18px; padding: 24px;
      width: 92%; max-width: 380px; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .detail-modal__title { font-size: 1rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 14px; }
    .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
    .detail-row:last-of-type { border-bottom: none; }
    .detail-row .lbl { color: var(--gray); font-weight: 600; }
    .detail-row .val { font-weight: 700; text-align: right; }
    .detail-close { margin-top: 16px; width: 100%; padding: 10px; border: none; border-radius: 10px; background: var(--bg); font-weight: 700; cursor: pointer; }

    @media (max-width: 600px) {
      .cal-wrap { padding: 8px; }
      .cal-period { font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-logo">🎣</div>
    <div class="pin-title">Lac de Podensac</div>
    <div class="pin-sub">Planning — Accès gardienne</div>
    <form id="pin-form">
      <input type="password" inputmode="numeric" class="pin-input" id="pin-input"
             placeholder="••••" maxlength="8" autocomplete="off">
      <button type="submit" class="pin-btn">Accéder au planning</button>
      <div class="pin-error" id="pin-error"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav>
    <div class="nav-title">Planning <span>Lac de Podensac</span></div>
    <div class="nav-right">
      <a href="index.html" class="btn-back">← Site</a>
      <button class="btn-pin-out" id="btn-logout">Verrouiller</button>
    </div>
  </nav>
  <div class="cal-wrap">
    <div class="cal-header">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="cal-prev">‹</button>
        <button class="cal-today-btn" id="cal-today">Aujourd'hui</button>
        <button class="cal-nav-btn" id="cal-next">›</button>
      </div>
      <div class="cal-period" id="cal-period">—</div>
      <div class="cal-view-tabs">
        <button class="cal-view-tab" data-view="month">Mois</button>
        <button class="cal-view-tab" data-view="week">Semaine</button>
        <button class="cal-view-tab active" data-view="planning">Planning</button>
      </div>
    </div>
    <div id="cal-container"></div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-modal">
    <div class="detail-modal__title" id="detail-title"></div>
    <div id="detail-body"></div>
    <button class="detail-close" onclick="closeDetail()">Fermer</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/postes.js"></script>
<script>
// ═══════════════════════════════════════════════
// CODE PIN — modifiez la valeur ci-dessous
const GARDIENNE_PIN = '1234';
// ═══════════════════════════════════════════════

const PIN_KEY = 'gardienne_unlocked';

function checkUnlocked() {
  return sessionStorage.getItem(PIN_KEY) === '1';
}
function unlock() {
  sessionStorage.setItem(PIN_KEY, '1');
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initCalendar();
}
function lock() {
  sessionStorage.removeItem(PIN_KEY);
  location.reload();
}

document.getElementById('pin-form').addEventListener('submit', e => {
  e.preventDefault();
  const val = document.getElementById('pin-input').value;
  if (val === GARDIENNE_PIN) {
    unlock();
  } else {
    document.getElementById('pin-error').textContent = 'Code incorrect.';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
  }
});
document.getElementById('btn-logout').addEventListener('click', lock);

if (checkUnlocked()) {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ── CALENDAR ──────────────────────────────────
let allReservations = [];
let calView = 'planning';
let calDate = new Date();
const JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MOIS  = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAY_W = 38;

function toDS(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getDow(d) { return (d.getDay()+6)%7; }
function fmtDate(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}

function expandDates(start, end) {
  const arr = [];
  const d = new Date(start+'T00:00:00');
  const last = new Date((end||start)+'T00:00:00');
  while (d < last) { arr.push(toDS(d)); d.setDate(d.getDate()+1); }
  if (arr.length === 0) arr.push(start);
  return arr;
}

function getResDates(r) {
  if (r.date) return [r.date];
  if (r.dateDebut) {
    let end = r.dateFin;
    if (!end || end === r.dateDebut) {
      if (r.formule && r.formule.startsWith('nuit-')) {
        const n = parseInt(r.formule.split('-')[1])||0;
        if (n > 0) { const d = new Date(r.dateDebut+'T00:00:00'); d.setDate(d.getDate()+n); end = toDS(d); }
      }
      if ((!end || end === r.dateDebut) && r.duree > 1) {
        const d = new Date(r.dateDebut+'T00:00:00'); d.setDate(d.getDate()+r.duree); end = toDS(d);
      }
    }
    return expandDates(r.dateDebut, end||r.dateDebut);
  }
  if (r.dates && r.dates.length) return r.dates;
  return [];
}

function getResForDate(ds) {
  return allReservations.filter(r => getResDates(r).includes(ds));
}

function typeLabel(r) {
  return r.type==='peche'?'🎣 Pêche':r.type==='bateau'?'🔥 Bateau BBQ':r.type==='canoe'?'🛶 Canoé':r.type==='campingcar'?'🚐 Camping-car':r.type==='tente'?'⛺ Tente':'📋';
}
function chipBg(r) {
  const s = r.status||'pending';
  if (s==='cancelled') return ['#e8e8e8','#999'];
  if (r.type==='peche') return s==='confirmed'?['#2a6059','#fff']:['#9a7000','#fff'];
  if (r.type==='bateau') return ['#c27010','#fff'];
  if (r.type==='canoe') return ['#1a6080','#fff'];
  if (r.type==='campingcar') return ['#6040a0','#fff'];
  if (r.type==='tente') return ['#3a7040','#fff'];
  return ['#888','#fff'];
}

function updateHeader() {
  let lbl = '';
  if (calView==='month') lbl = `${MOIS[calDate.getMonth()]} ${calDate.getFullYear()}`;
  else if (calView==='week') {
    const mon = new Date(calDate); mon.setDate(mon.getDate()-getDow(mon));
    const sun = new Date(mon); sun.setDate(sun.getDate()+6);
    lbl = `${mon.getDate()} ${MOIS[mon.getMonth()].slice(0,3)}. — ${sun.getDate()} ${MOIS[sun.getMonth()].slice(0,3)}. ${sun.getFullYear()}`;
  } else lbl = `${MOIS[calDate.getMonth()]} ${calDate.getFullYear()}`;
  document.getElementById('cal-period').textContent = lbl;
  document.querySelectorAll('.cal-view-tab').forEach(t => t.classList.toggle('active', t.dataset.view===calView));
}

function navigate(dir) {
  const d = new Date(calDate);
  if (calView==='month'||calView==='planning') d.setMonth(d.getMonth()+dir);
  else if (calView==='week') d.setDate(d.getDate()+dir*7);
  calDate = d; render();
}

function render() {
  updateHeader();
  const c = document.getElementById('cal-container');
  if (calView==='month') renderMonth(c);
  else if (calView==='week') renderWeek(c);
  else renderPlanning(c);
}

// ── MONTH VIEW ──
function renderMonth(c) {
  const year=calDate.getFullYear(), month=calDate.getMonth();
  const today=toDS(new Date()), first=new Date(year,month,1), last=new Date(year,month+1,0);
  let html=`<div class="cal-month-grid"><div class="cal-month-dow-row">${JOURS.map(j=>`<div class="cal-month-dow">${j}</div>`).join('')}</div><div class="cal-month-days">`;
  for (let i=0;i<getDow(first);i++) {
    const pd=new Date(year,month,1-getDow(first)+i);
    html+=`<div class="cal-month-cell other-month"><div class="cal-day-num">${pd.getDate()}</div></div>`;
  }
  for (let d=1;d<=last.getDate();d++) {
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayRes=getResForDate(ds);
    const chips=dayRes.slice(0,3).map(r=>{
      const [bg,cl]=chipBg(r);
      const name=`${r.prenom||''} ${(r.nom||'').toUpperCase()}`.trim();
      return `<button class="cal-event-chip" style="background:${bg};color:${cl}" onclick="openDetail('${r.id}')">${name}</button>`;
    }).join('');
    const more=dayRes.length-3;
    html+=`<div class="cal-month-cell${ds===today?' today':''}"><div class="cal-day-num">${d}</div>${chips}${more>0?`<div class="cal-more-link">+${more}</div>`:''}</div>`;
  }
  const total=getDow(first)+last.getDate();
  const trail=total%7===0?0:7-(total%7);
  for (let i=1;i<=trail;i++) html+=`<div class="cal-month-cell other-month"><div class="cal-day-num">${i}</div></div>`;
  html+=`</div></div>`;
  c.innerHTML=html;
}

// ── WEEK VIEW ──
function renderWeek(c) {
  const today=toDS(new Date());
  const mon=new Date(calDate); mon.setDate(mon.getDate()-getDow(mon));
  let cols='';
  for (let i=0;i<7;i++) {
    const day=new Date(mon); day.setDate(day.getDate()+i);
    const ds=toDS(day);
    const dayRes=getResForDate(ds);
    const events=dayRes.map(r=>{
      const [bg,cl]=chipBg(r);
      const name=`${r.prenom||''} ${(r.nom||'').toUpperCase()}`.trim();
      return `<button class="cal-week-event" style="background:${bg};color:${cl}" onclick="openDetail('${r.id}')"><div class="cal-week-event-name">${typeLabel(r).split(' ')[0]} ${name}</div></button>`;
    }).join('');
    cols+=`<div class="cal-week-col${ds===today?' today-col':''}">
      <div class="cal-week-col-header">
        <div class="cal-week-dow">${JOURS[i]}</div>
        <div class="cal-week-day-num${ds===today?' today':''}">${day.getDate()}</div>
      </div>
      <div class="cal-week-col-events">${events||'<div style="padding:8px;font-size:0.65rem;color:#ccc;text-align:center">—</div>'}</div>
    </div>`;
  }
  c.innerHTML=`<div class="cal-week-scroll"><div class="cal-week-grid">${cols}</div></div>`;
}

// ── PLANNING VIEW ──
function renderPlanning(c) {
  const year=calDate.getFullYear(), month=calDate.getMonth();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=toDS(new Date());
  const NUM_DAYS=daysInMonth;
  const HALF=DAY_W/2;

  const days=Array.from({length:NUM_DAYS},(_,i)=>{
    const d=new Date(year,month,i+1);
    const str=toDS(d), dow=getDow(d);
    return {str,isWeekend:dow>=5,isToday:str===today,dayName:JOURS[dow],dayNum:i+1};
  });
  function dayIndex(ds) { return new Date(ds+'T00:00:00').getDate()-1; }

  function getBlocks(relevant) {
    return relevant.flatMap(r=>{
      const rDates=getResDates(r);
      if (!rDates.length) return [];
      const sorted=[...rDates].sort();
      const segments=[]; let sS=sorted[0],sE=sorted[0];
      for (let i=1;i<sorted.length;i++) {
        const diff=Math.round((new Date(sorted[i]+'T00:00:00')-new Date(sorted[i-1]+'T00:00:00'))/86400000);
        if (diff<=1) sE=sorted[i]; else { segments.push([sS,sE]); sS=sE=sorted[i]; }
      }
      segments.push([sS,sE]);
      return segments.flatMap(([sd,ed])=>{
        const si=dayIndex(sd), ei=dayIndex(ed);
        const rawL=si*DAY_W+HALF, rawR=(ei+1)*DAY_W+HALF;
        const clL=Math.max(rawL,0), clR=Math.min(rawR,NUM_DAYS*DAY_W);
        if (clL>=NUM_DAYS*DAY_W||clR<=0) return [];
        const left=clL+2, width=clR-clL-4;
        if (width<=0) return [];
        const name=`${r.prenom||''} ${(r.nom||'').toUpperCase()}`.trim();
        const [bg,cl]=chipBg(r);
        const isCancelled=(r.status||'')===('cancelled');
        return [{r,name,left,width,bg,cl,isCancelled}];
      });
    });
  }

  function assignSlots(list,n) {
    const slots=Array.from({length:n},()=>[]);
    const sorted=[...list].sort((a,b)=>(getResDates(a)[0]||'').localeCompare(getResDates(b)[0]||''));
    for (const r of sorted) {
      const rD=getResDates(r); if (!rD.length) continue;
      const rS=new Date(rD[0]+'T00:00:00').getTime(), rE=new Date(rD[rD.length-1]+'T00:00:00').getTime();
      let placed=false;
      for (let i=0;i<n;i++) {
        const ok=!slots[i].some(ex=>{const eD=getResDates(ex);const eS=new Date(eD[0]+'T00:00:00').getTime(),eE=new Date(eD[eD.length-1]+'T00:00:00').getTime();return rS<=eE&&rE>=eS;});
        if (ok){slots[i].push(r);placed=true;break;}
      }
      if (!placed) slots[n-1].push(r);
    }
    return slots;
  }

  const labelsHtml=[], timelinesHtml=[];
  function addRow(label,relevant,style='') {
    const blocks=getBlocks(relevant);
    const dayCols=days.map(({str:ds,isWeekend,isToday})=>{
      const cls=[isWeekend?'weekend':'',isToday?'today-col':''].filter(Boolean).join(' ');
      return `<div class="cal-planning-day-col ${cls}" style="width:${DAY_W}px;min-width:${DAY_W}px;"></div>`;
    }).join('');
    const blocksHtml=blocks.map(b=>`<button class="cal-planning-block" onclick="openDetail('${b.r.id}')" style="left:${b.left}px;width:${b.width}px;background:${b.bg};color:${b.cl};">${b.isCancelled?'✗ ':''} ${b.name}</button>`).join('');
    labelsHtml.push(`<div class="cal-planning-label${style?' '+style:''}">${label}</div>`);
    timelinesHtml.push(`<div class="cal-planning-row"><div class="cal-planning-timeline" style="width:${NUM_DAYS*DAY_W}px;">${dayCols}${blocksHtml}</div></div>`);
  }
  function addSection(label) {
    labelsHtml.push(`<div class="cal-planning-label section-head">${label}</div>`);
    timelinesHtml.push(`<div class="cal-planning-row" style="background:rgba(42,96,89,0.025);"><div class="cal-planning-timeline" style="width:${NUM_DAYS*DAY_W}px;"></div></div>`);
  }

  // Header row
  const hCols=days.map(({isWeekend,isToday,dayName,dayNum})=>{
    const cls=[isWeekend?'weekend':'',isToday?'today-col':''].filter(Boolean).join(' ');
    return `<div class="cal-planning-day-col ${cls}" style="width:${DAY_W}px;min-width:${DAY_W}px;"><div class="cal-planning-day-header-cell">${dayName}<br>${dayNum}</div></div>`;
  }).join('');
  labelsHtml.push(`<div class="cal-planning-label" style="font-size:0.6rem;font-weight:800;text-transform:uppercase;color:var(--gray);">Ressource</div>`);
  timelinesHtml.push(`<div class="cal-planning-row" style="border-bottom:2px solid var(--border);"><div class="cal-planning-timeline" style="width:${NUM_DAYS*DAY_W}px;">${hCols}</div></div>`);

  // Pêche postes
  const postes=(typeof POSTES!=='undefined'?POSTES:[]).filter(p=>!p.coming_soon&&p.disponible!==false);
  addSection('🎣 Pêche');
  postes.forEach(p=>addRow(`${p.icon||'🎣'} P.${p.id}`,allReservations.filter(r=>r.type==='peche'&&r.posteId===p.id)));

  // Carnassier
  const carnSlots=assignSlots(allReservations.filter(r=>r.type==='peche'&&(r.posteId==='zone-carnassier'||r.zone==='carnassier'||(r.activity&&r.activity.startsWith('carnassier')))),5);
  addSection('🐟 Carnassier');
  carnSlots.forEach((s,i)=>addRow(`Zone ${i+1}`,s));

  // Bateaux
  addSection('🔥 Bateaux BBQ');
  ['Martin Pêcheur','Aigrette'].forEach(b=>addRow(b,allReservations.filter(r=>r.type==='bateau'&&(r.bateau||'').trim()===b)));

  // Canoé
  const canoeSlots=assignSlots(allReservations.filter(r=>r.type==='canoe'),2);
  addSection('🛶 Canoé');
  canoeSlots.forEach((s,i)=>addRow(`Canoé ${i+1}`,s));

  // Camping-car
  addSection('🚐 Camping-car');
  Array.from({length:8},(_,i)=>addRow(`Place ${i+1}`,allReservations.filter(r=>r.type==='campingcar'&&String(r.emplacement)===String(i+1))));

  const [hLabel,...bLabels]=labelsHtml;
  const [hTimeline,...bTimelines]=timelinesHtml;

  const savedW=localStorage.getItem('planning-label-w');
  if (savedW) document.documentElement.style.setProperty('--planning-label-w',savedW+'px');

  c.innerHTML=`<div class="cal-planning-outer">
    <div class="cal-planning-sticky-header" id="planning-sticky-header">
      <div class="cal-planning-sticky-label">${hLabel}</div>
      <div class="cal-planning-sticky-scroll" id="planning-sticky-scroll">${hTimeline}</div>
    </div>
    <div class="cal-planning-body-wrap">
      <div class="cal-planning-labels-col" id="planning-labels-col">
        <div class="cal-planning-resize-handle" id="planning-resize-handle"></div>
        ${bLabels.join('')}
      </div>
      <div class="cal-planning-scroll-col" id="planning-body-scroll">${bTimelines.join('')}</div>
    </div>
  </div>`;

  requestAnimationFrame(()=>{
    // Sync scroll
    const body=document.getElementById('planning-body-scroll');
    const sticky=document.getElementById('planning-sticky-scroll');
    if (body&&sticky) body.addEventListener('scroll',()=>{sticky.scrollLeft=body.scrollLeft},{passive:true});
    // Auto-scroll to today
    const realToday=new Date();
    if (realToday.getFullYear()===year&&realToday.getMonth()===month) {
      const targetScroll=Math.max(0,(realToday.getDate()-1-7)*DAY_W);
      if (body) body.scrollLeft=targetScroll;
    }
    // Resize handle
    const handle=document.getElementById('planning-resize-handle');
    if (!handle) return;
    let startX,startW;
    const setW=w=>{const clamped=Math.max(50,Math.min(200,w));document.documentElement.style.setProperty('--planning-label-w',clamped+'px');localStorage.setItem('planning-label-w',clamped);};
    handle.addEventListener('mousedown',e=>{e.preventDefault();startX=e.clientX;startW=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--planning-label-w'))||80;handle.classList.add('dragging');const mv=e=>setW(startW+e.clientX-startX);const up=()=>{handle.classList.remove('dragging');window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);});
    handle.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startW=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--planning-label-w'))||80;},{passive:true});
    handle.addEventListener('touchmove',e=>{setW(startW+e.touches[0].clientX-startX);},{passive:true});
  });
}

// ── DETAIL POPUP ──
function openDetail(id) {
  const r=allReservations.find(x=>x.id===id);
  if (!r) return;
  const icons={peche:'🎣',bateau:'🔥',canoe:'🛶',campingcar:'🚐',tente:'⛺'};
  document.getElementById('detail-title').textContent=`${icons[r.type]||'📋'} ${typeLabel(r)} — ${r.prenom||''} ${(r.nom||'').toUpperCase()}`.trim();
  const rows=[];
  if (r.tel) rows.push(['Téléphone',`<a href="tel:${r.tel}">${r.tel}</a>`]);
  if (r.email) rows.push(['Email',r.email]);
  const statusL={confirmed:'✓ Confirmée',pending:'⏳ En attente',cancelled:'✗ Annulée'};
  rows.push(['Statut',statusL[r.status||'pending']||r.status]);
  if (r.dateDebut) rows.push(['Arrivée',fmtDate(r.dateDebut)]);
  if (r.dateFin&&r.dateFin!==r.dateDebut) rows.push(['Départ',fmtDate(r.dateFin)]);
  if (r.date) rows.push(['Date',fmtDate(r.date)]);
  if (r.posteId&&r.type==='peche') {
    const p=(typeof POSTES!=='undefined'?POSTES:[]).find(x=>x.id===r.posteId);
    rows.push(['Poste',p?`${p.icon||''} ${p.nom}`:`#${r.posteId}`]);
  }
  if (r.emplacement) rows.push(['Emplacement',`Place ${r.emplacement}`]);
  if (r.nb) rows.push(['Personnes',r.nb]);
  if (r.formule) rows.push(['Formule',r.formule]);
  if (r.message) rows.push(['Message',r.message]);
  if (r.noteInterne) rows.push(['Note interne',r.noteInterne]);
  document.getElementById('detail-body').innerHTML=rows.map(([l,v])=>`<div class="detail-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');
  document.getElementById('detail-overlay').classList.add('open');
}
function closeDetail() { document.getElementById('detail-overlay').classList.remove('open'); }
document.getElementById('detail-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail();});

// ── INIT ──
function initCalendar() {
  LacDB.watchAllReservations(res=>{
    allReservations=res;
    render();
  });
  document.getElementById('cal-prev').addEventListener('click',()=>navigate(-1));
  document.getElementById('cal-next').addEventListener('click',()=>navigate(1));
  document.getElementById('cal-today').addEventListener('click',()=>{calDate=new Date();render();});
  document.querySelectorAll('.cal-view-tab').forEach(t=>{
    t.addEventListener('click',()=>{calView=t.dataset.view;render();});
  });
  // Touch swipe (not in planning view)
  let tx=null,ty=null;
  document.getElementById('cal-container').addEventListener('touchstart',e=>{if(calView==='planning')return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  document.getElementById('cal-container').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dy)>Math.abs(dx)){tx=null;return;}if(Math.abs(dx)>=60){const d=new Date(calDate);d.setDate(d.getDate()+(dx<0?1:-1));calDate=d;render();}tx=null;ty=null;},{passive:true});
}

if (checkUnlocked()) initCalendar();
</script>
