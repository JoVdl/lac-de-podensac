<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantiers — Suivi budgétaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1a4e8a; --primary-light: #2a6db5; --primary-dark: #0f2f55;
      --accent: #e8951e; --success: #1e8a4a; --success-bg: #e8f7ee;
      --danger: #c0392b; --danger-bg: #fdf0ee; --warning: #b07800; --warning-bg: #fff8e6;
      --gray: #5a6a72; --bg: #f0f4f8; --border: #dde3ea; --text: #1a2530;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* PIN */
    #pin-screen { position:fixed;inset:0;background:var(--primary-dark);display:flex;align-items:center;justify-content:center;z-index:9999; }
    .pin-box { background:white;border-radius:16px;padding:40px 36px;text-align:center;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .pin-box h2 { font-family:'Montserrat',sans-serif;font-size:1.3rem;margin-bottom:8px;color:var(--primary-dark); }
    .pin-box p { font-size:.85rem;color:var(--gray);margin-bottom:24px; }
    .pin-input-wrap { display:flex;gap:10px;justify-content:center;margin-bottom:20px; }
    .pin-input-wrap input { width:52px;height:60px;border:2px solid var(--border);border-radius:10px;font-size:1.6rem;text-align:center;font-family:'Montserrat',sans-serif; }
    .pin-input-wrap input:focus { outline:none;border-color:var(--primary); }
    .pin-error { color:var(--danger);font-size:.85rem;min-height:20px; }

    #app { display:none; }
    header { background:var(--primary-dark);color:white;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px; }
    header h1 { font-family:'Montserrat',sans-serif;font-size:1rem;white-space:nowrap; }

    /* Type switcher */
    .type-switcher { display:flex;gap:0;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.2); }
    .type-btn { padding:6px 16px;border:none;cursor:pointer;font-size:.82rem;font-weight:700;color:rgba(255,255,255,.7);background:none;transition:all .15s; }
    .type-btn.active { background:white;color:var(--primary-dark); }

    .btn { display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:.82rem;font-weight:700;transition:all .15s; }
    .btn-secondary { background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.3); }
    .btn-secondary:hover { background:rgba(255,255,255,.25); }
    .btn-sm { padding:5px 11px;font-size:.78rem; }
    .btn-outline { background:white;color:var(--primary);border:1.5px solid var(--primary); }
    .btn-outline:hover { background:var(--primary);color:white; }
    .btn-primary { background:var(--primary);color:white; }

    .main { max-width:1400px;margin:0 auto;padding:22px 18px; }
    .tabs { display:flex;gap:4px;background:white;padding:5px;border-radius:10px;margin-bottom:20px;border:1px solid var(--border);width:fit-content; }
    .tab { padding:7px 18px;border-radius:7px;border:none;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--gray);background:none;transition:all .15s; }
    .tab.active { background:var(--primary);color:white; }

    .stats-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-bottom:20px; }
    .stat-card { background:white;border-radius:10px;padding:16px;border:1px solid var(--border); }
    .stat-card .label { font-size:.72rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px; }
    .stat-card .value { font-family:'Montserrat',sans-serif;font-size:1.25rem;font-weight:800;color:var(--primary-dark); }
    .stat-card .sub { font-size:.72rem;color:var(--gray);margin-top:2px; }

    .filters-bar { background:white;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end; }
    .fg { display:flex;flex-direction:column;gap:4px; }
    .fg label { font-size:.72rem;font-weight:700;color:var(--gray); }
    .fg input,.fg select { padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:.83rem;min-width:130px; }
    .fg input:focus,.fg select:focus { outline:none;border-color:var(--primary); }

    .card { background:white;border-radius:10px;border:1px solid var(--border);overflow:hidden; }
    .card-hdr { padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border); }
    .card-hdr h2 { font-family:'Montserrat',sans-serif;font-size:.9rem; }
    table { width:100%;border-collapse:collapse;font-size:.82rem; }
    th { background:#f5f7fa;padding:8px 11px;text-align:left;font-size:.72rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap; }
    th:hover { background:#eef0f4; }
    td { padding:8px 11px;border-bottom:1px solid #f0f2f5;vertical-align:middle; }
    tr:hover td { background:#fafbfd; }
    tr:last-child td { border-bottom:none; }
    .amt { text-align:right;font-weight:600;white-space:nowrap; }
    .pos { color:var(--primary-dark); } .neg { color:var(--danger); }
    .grp-row td { background:#f0f5ff;font-weight:700;font-size:.8rem;color:var(--primary-dark); }
    .grp-row:hover td { background:#e8f0ff; }

    .prog-wrap { display:flex;align-items:center;gap:7px;min-width:130px; }
    .prog-bar { flex:1;height:6px;background:#e8ecf0;border-radius:3px;overflow:hidden; }
    .prog-fill { height:100%;border-radius:3px; }
    .prog-pct { font-size:.73rem;font-weight:700;min-width:32px;text-align:right; }

    .code-tag { font-family:monospace;font-size:.77rem;color:var(--primary);background:#eef3fb;padding:2px 6px;border-radius:3px;white-space:nowrap; }
    .comment-cell { font-size:.77rem;color:var(--gray);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer; }
    .comment-cell:hover { color:var(--primary); }
    .comment-cell.empty { color:#b0bac4;font-style:italic; }

    /* Op cards (par opération tab) */
    .op-detail { margin-bottom:16px;border:1.5px solid var(--primary);border-radius:10px;overflow:hidden; }
    .op-detail-hdr { background:var(--primary);color:white;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer; }
    .op-detail-hdr h3 { font-family:'Montserrat',sans-serif;font-size:.9rem;flex:1; }
    .op-detail-body { padding:14px 16px; }

    /* Modal */
    .modal-backdrop { position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center; }
    .modal { background:white;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .modal h3 { font-family:'Montserrat',sans-serif;font-size:1rem;margin-bottom:16px; }
    .modal-info { background:#f5f8ff;border:1px solid #d0ddf5;border-radius:7px;padding:11px;margin-bottom:14px;font-size:.79rem;color:var(--gray); }
    .modal-info strong { color:var(--primary-dark); }
    .form-row { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px; }
    .form-row.full { grid-template-columns:1fr; }
    .form-group { display:flex;flex-direction:column;gap:4px; }
    .form-group label { font-size:.75rem;font-weight:700;color:var(--gray); }
    .form-group input,.form-group textarea { padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:.85rem;font-family:inherit; }
    .form-group input:focus,.form-group textarea:focus { outline:none;border-color:var(--primary); }
    .form-group textarea { resize:vertical;min-height:68px; }
    .modal-footer { display:flex;justify-content:flex-end;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border); }

    .import-area { border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfc; }
    .import-area:hover,.import-area.drag-over { border-color:var(--primary);background:#eef3fb; }

    .notif { position:fixed;top:18px;right:18px;background:var(--primary-dark);color:white;padding:10px 16px;border-radius:8px;font-size:.85rem;z-index:9000;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:si .2s; }
    .notif.success { background:var(--success); } .notif.error { background:var(--danger); }
    @keyframes si { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

    @media(max-width:768px) { .stats-grid{grid-template-columns:1fr 1fr} .form-row{grid-template-columns:1fr} }
  </style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-box">
    <h2>🔒 Accès restreint</h2>
    <p>Code PIN pour accéder au suivi des chantiers</p>
    <div class="pin-input-wrap">
      <input type="password" maxlength="1" class="pin-digit" data-idx="0" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-digit" data-idx="1" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-digit" data-idx="2" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-digit" data-idx="3" inputmode="numeric">
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>🏗️ Suivi Chantiers 2026</h1>
    <div class="type-switcher">
      <button class="type-btn active" onclick="switchType('investissement')">📐 Investissement</button>
      <button class="type-btn" onclick="switchType('fonctionnement')">⚙️ Fonctionnement</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" onclick="showImportModal()">📥 Importer XLS</button>
    </div>
  </header>

  <div class="main">
    <div class="tabs">
      <button class="tab active" data-tab="lignes" onclick="switchTab('lignes')">📋 Lignes</button>
      <button class="tab" data-tab="operations" onclick="switchTab('operations')">🗂️ Par groupe</button>
      <button class="tab" data-tab="stats" onclick="switchTab('stats')">📈 Statistiques</button>
    </div>

    <!-- TAB LIGNES -->
    <div id="tab-lignes">
      <div class="stats-grid" id="global-stats"></div>
      <div class="filters-bar">
        <div class="fg">
          <label id="filter-grp-label">Opération</label>
          <select id="filter-grp" onchange="applyFilters()"><option value="">Tous</option></select>
        </div>
        <div class="fg">
          <label>Recherche</label>
          <input type="text" id="filter-search" placeholder="Libellé, nature, site…" oninput="applyFilters()">
        </div>
        <div class="fg">
          <label>Statut</label>
          <select id="filter-status" onchange="applyFilters()">
            <option value="">Tous</option>
            <option value="ok">✅ OK (≤75%)</option>
            <option value="warn">⚠️ Attention (75-100%)</option>
            <option value="over">🔴 Dépassé</option>
            <option value="zero">⬜ Non commencé</option>
          </select>
        </div>
        <div class="fg">
          <label>Nature</label>
          <select id="filter-nature" onchange="applyFilters()"><option value="">Toutes</option></select>
        </div>
        <div class="fg">
          <label>Antenne / Site</label>
          <select id="filter-antenne" onchange="applyFilters()"><option value="">Toutes</option></select>
        </div>
        <div class="fg">
          <label>Lignes à zéro</label>
          <select id="filter-zeros" onchange="applyFilters()">
            <option value="hide" selected>Masquer</option>
            <option value="">Afficher tout</option>
          </select>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr">
          <h2 id="table-title">Détail des comptes — Investissement</h2>
          <span id="lines-count" style="font-size:.78rem;color:var(--gray)"></span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead id="table-head"></thead>
            <tbody id="lines-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB PAR GROUPE -->
    <div id="tab-operations" style="display:none">
      <div id="ops-list"></div>
    </div>

    <!-- TAB STATS -->
    <div id="tab-stats" style="display:none">
      <div class="stats-grid" id="stats-global" style="margin-bottom:20px"></div>
      <div class="card">
        <div class="card-hdr"><h2 id="stats-table-title">Récapitulatif</h2></div>
        <div style="overflow-x:auto">
          <table>
            <thead id="stats-thead"></thead>
            <tbody id="stats-ops-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal annotation -->
<div id="line-modal" style="display:none">
  <div class="modal-backdrop" onclick="closeLineModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>📋 Annotation</h3>
      <div class="modal-info" id="line-modal-info"></div>
      <div class="form-row">
        <div class="form-group">
          <label>Subvention (€)</label>
          <input type="number" id="line-subvention" placeholder="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Financeur</label>
          <input type="text" id="line-financeur" placeholder="ex: DETR, Région…">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label>Commentaire / Notes</label>
          <textarea id="line-comment" placeholder="Situation, points de vigilance…"></textarea>
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label>Prochaine échéance</label>
          <input type="text" id="line-echeance" placeholder="ex: Réception travaux 15/03/2026">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeLineModal()">Annuler</button>
        <button class="btn btn-primary" onclick="saveLine()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal import -->
<div id="import-modal" style="display:none">
  <div class="modal-backdrop" onclick="closeImportModal()">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:480px">
      <h3>📥 Importer un fichier XLS</h3>
      <p style="font-size:.84rem;color:var(--gray);margin-bottom:14px">Fichier XML SpreadsheetML. Sélectionnez d'abord le type, puis importez.</p>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button id="imp-type-invest" class="btn btn-primary btn-sm" onclick="setImportType('investissement')">📐 Investissement</button>
        <button id="imp-type-fonct" class="btn btn-outline btn-sm" onclick="setImportType('fonctionnement')">⚙️ Fonctionnement</button>
      </div>
      <div class="import-area" onclick="document.getElementById('import-file').click()">
        <div style="font-size:1.8rem;margin-bottom:6px">📂</div>
        <p style="color:var(--gray);font-size:.88rem">Cliquer ou glisser-déposer</p>
        <input type="file" id="import-file" accept=".xls,.xml" style="display:none" onchange="handleImportFile(event)">
      </div>
      <div id="import-status" style="margin-top:10px;font-size:.83rem;color:var(--gray)"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeImportModal()">Fermer</button>
        <button class="btn btn-primary" id="import-confirm-btn" style="display:none" onclick="confirmImport()">Importer</button>
      </div>
    </div>
  </div>
</div>

// ─── PIN ──────────────────────────────────────────────────────────────────
const CORRECT_PIN = '1234';
const PIN_KEY = 'chantiers_pin_ok';
function initPin() {
  if (sessionStorage.getItem(PIN_KEY) === '1') { unlock(); return; }
  const digits = document.querySelectorAll('.pin-digit');
  digits.forEach((el, i) => {
    el.addEventListener('input', () => {
      el.value = el.value.replace(/\D/g, '');
      if (el.value && i < digits.length - 1) digits[i + 1].focus();
      if ([...digits].every(d => d.value)) checkPin();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Backspace' && !el.value && i > 0) digits[i - 1].focus(); });
  });
  digits[0].focus();
}
function checkPin() {
  const digits = document.querySelectorAll('.pin-digit');
  const entered = [...digits].map(d => d.value).join('');
  if (entered === CORRECT_PIN) { sessionStorage.setItem(PIN_KEY, '1'); unlock(); }
  else {
    document.getElementById('pin-error').textContent = 'Code incorrect.';
    digits.forEach(d => { d.value = ''; d.style.borderColor = 'var(--danger)'; });
    setTimeout(() => { digits.forEach(d => d.style.borderColor = ''); digits[0].focus(); }, 1000);
  }
}
function unlock() {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initData();
}

const ANNOTS_KEY = 'chantiers_annotations';
function saveAnnots() { try { localStorage.setItem(ANNOTS_KEY, JSON.stringify(annotations)); } catch(_) {} }
function loadAnnots() { try { const r = localStorage.getItem(ANNOTS_KEY); return r ? JSON.parse(r) : {}; } catch(_) { return {}; } }

let annotations = {};
let currentType = 'investissement';
let allLines = [];
let filtered = [];
let sortKey = '', sortAsc = true;
let editId = null;
let importType = 'investissement';
let importedLines = null;

function initData() {
  annotations = loadAnnots();
  applyType('investissement');
}

function mergeAnnots(baselines) {
  return baselines.map(b => ({
    ...b,
    comment: annotations[b.id]?.comment || '',
    subvention: annotations[b.id]?.subvention || 0,
    financeur: annotations[b.id]?.financeur || '',
    echeance: annotations[b.id]?.echeance || '',
  }));
}

function switchType(type) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(type.substring(0,5))));
  applyType(type);
}

function applyType(type) {
  currentType = type;
  allLines = mergeAnnots(type === 'investissement' ? INVEST_LINES : FONCT_LINES);
  sortKey = type === 'investissement' ? 'operation' : 'libelleFonction';
  sortAsc = true;
  document.getElementById('table-title').textContent = 'Détail des comptes — ' + (type === 'investissement' ? 'Investissement' : 'Fonctionnement');
  document.getElementById('stats-table-title').textContent = 'Récapitulatif — ' + (type === 'investissement' ? 'Investissement' : 'Fonctionnement');
  document.getElementById('filter-grp-label').textContent = type === 'investissement' ? 'Opération' : 'Chapitre';
  updateTableHead();
  populateGrpFilter();
  populateNatureFilter();
  populateAntenneFilter();
  applyFilters();
  renderStatsTab();
  const activeTab = document.querySelector('.tab.active')?.dataset.tab;
  if (activeTab === 'operations') renderOpsTab();
}

function updateTableHead() {
  const isInvest = currentType === 'investissement';
  document.getElementById('table-head').innerHTML = `<tr>
    <th onclick="sortBy('${isInvest ? 'operation' : 'libelleFonction'}')">${isInvest ? 'Opération' : 'Fonction'} ⇅</th>
    <th onclick="sortBy('nature')">Nature ⇅</th>
    <th onclick="sortBy('libelleAntenne')">Site / Antenne ⇅</th>
    <th onclick="sortBy('budget')" style="text-align:right">Budgété ⇅</th>
    <th onclick="sortBy('ens')" style="text-align:right">ENS ⇅</th>
    <th onclick="sortBy('mandate')" style="text-align:right">Mandaté ⇅</th>
    <th onclick="sortBy('disponible')" style="text-align:right">Disponible ⇅</th>
    <th>Avancement</th>
    <th>Subvention</th>
    <th>Commentaire</th>
    <th></th>
  </tr>`;
}

// ─── FILTERS ──────────────────────────────────────────────────────────────
function populateGrpFilter() {
  const isInvest = currentType === 'investissement';
  const keys = [...new Set(allLines.map(l => isInvest ? l.operation : l.chapitre))].sort();
  const sel = document.getElementById('filter-grp');
  sel.innerHTML = '<option value="">Tous</option>' + keys.map(k => {
    const lib = isInvest
      ? (allLines.find(l => l.operation === k)?.libelleOperation || '')
      : (allLines.find(l => l.chapitre === k)?.libelleChapitre || '');
    return `<option value="${k}">${k}${lib ? ' — ' + lib.substring(0,40) : ''}</option>`;
  }).join('');
}

function populateNatureFilter() {
  const natures = [...new Map(allLines.map(l => [l.nature, l.libelleNature])).entries()]
    .sort((a, b) => a[0].localeCompare(b[0]));
  const sel = document.getElementById('filter-nature');
  sel.innerHTML = '<option value="">Toutes</option>' + natures.map(([code, lib]) =>
    `<option value="${code}">${code}${lib ? ' — ' + lib.substring(0, 40) : ''}</option>`
  ).join('');
}

function populateAntenneFilter() {
  const antennes = [...new Map(allLines.map(l => [l.antenne, l.libelleAntenne])).entries()]
    .sort((a, b) => a[0].localeCompare(b[0]));
  const sel = document.getElementById('filter-antenne');
  sel.innerHTML = '<option value="">Toutes</option>' + antennes.map(([code, lib]) =>
    `<option value="${code}">${code}${lib ? ' — ' + lib.substring(0, 40) : ''}</option>`
  ).join('');
}

function applyFilters() {
  const grp = document.getElementById('filter-grp').value;
  const nature = document.getElementById('filter-nature').value;
  const search = (document.getElementById('filter-search').value || '').toLowerCase();
  const status = document.getElementById('filter-status').value;
  const hideZeros = document.getElementById('filter-zeros').value === 'hide';
  const isInvest = currentType === 'investissement';

  filtered = allLines.filter(l => {
    if (grp && (isInvest ? l.operation : l.chapitre) !== grp) return false;
    if (nature && l.nature !== nature) return false;
    const antenne = document.getElementById('filter-antenne').value;
    if (antenne && l.antenne !== antenne) return false;
    if (hideZeros && l.budget === 0 && l.realise === 0) return false;
    const txt = isInvest
      ? `${l.libelleOperation} ${l.libelleNature} ${l.libelleAntenne} ${l.nature}`
      : `${l.libelleFonction} ${l.libelleNature} ${l.libelleAntenne} ${l.nature} ${l.libelleChapitre}`;
    if (search && !txt.toLowerCase().includes(search)) return false;
    if (status) {
      const pct = l.budget > 0 ? l.realise / l.budget : (l.realise > 0 ? 999 : 0);
      if (status === 'ok' && !(pct > 0 && pct <= 0.75)) return false;
      if (status === 'warn' && !(pct > 0.75 && pct <= 1)) return false;
      if (status === 'over' && pct <= 1) return false;
      if (status === 'zero' && pct > 0) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    let va = a[sortKey] ?? '', vb = b[sortKey] ?? '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return sortAsc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
  });

  renderTable();
  renderGlobalStats();
}

function sortBy(k) { if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; } applyFilters(); }

// ─── HELPERS ──────────────────────────────────────────────────────────────
function fmt(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString('fr-FR', {minimumFractionDigits:0,maximumFractionDigits:0}) + ' €';
}
function pColor(pct) {
  if (pct <= 0) return '#c8d0da';
  if (pct <= 0.75) return '#1e8a4a';
  if (pct <= 1) return '#e8951e';
  return '#c0392b';
}
function getGrpKey(l) { return currentType === 'investissement' ? l.operation : l.chapitre; }
function getGrpLabel(l) { return currentType === 'investissement' ? l.libelleOperation : l.libelleChapitre; }
function getGrpHeader(l) { return currentType === 'investissement'
  ? `<span class="code-tag">${l.operation}</span> <strong style="margin-left:6px">${l.libelleOperation}</strong> <span style="margin-left:6px;font-size:.73rem;color:var(--gray)">${l.libelleFonction}</span>`
  : `<span class="code-tag">${l.chapitre}</span> <strong style="margin-left:6px">${l.libelleChapitre}</strong>`; }

// ─── TABLE ────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('lines-body');
  document.getElementById('lines-count').textContent = `${filtered.length} ligne(s)`;
  if (!filtered.length) { tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:30px;color:var(--gray)">Aucune ligne</td></tr>`; return; }
  let lastGrp = null;
  tbody.innerHTML = filtered.map(l => {
    const pct = l.budget > 0 ? Math.min(l.realise/l.budget,1.5) : (l.realise > 0 ? 1.5 : 0);
    const pctD = l.budget > 0 ? Math.round(l.realise/l.budget*100) : (l.realise > 0 ? '∞' : 0);
    const color = pColor(l.budget>0 ? l.realise/l.budget : (l.realise>0?999:0));
    const com = l.comment || '';
    const grpKey = getGrpKey(l);
    let grpRow = '';
    if (grpKey !== lastGrp) {
      lastGrp = grpKey;
      const grpLines = filtered.filter(x => getGrpKey(x) === grpKey);
      const gb = grpLines.reduce((s,x)=>s+x.budget,0), gr = grpLines.reduce((s,x)=>s+x.realise,0);
      const gpct = gb>0?Math.round(gr/gb*100):'';
      grpRow = `<tr class="grp-row"><td colspan="3" style="padding:7px 11px">${getGrpHeader(l)}</td>
        <td class="amt">${fmt(gb)}</td><td></td><td></td>
        <td class="amt ${gb-gr<0?'neg':'pos'}">${fmt(gb-gr)}</td>
        <td colspan="4"><span style="color:${pColor(gb>0?gr/gb:0)};font-weight:700">${gpct?gpct+'%':''}</span></td></tr>`;
    }
    return grpRow + `<tr ondblclick="openLineModal('${l.id}')">
      <td style="padding-left:20px;font-size:.78rem;color:var(--gray)">${currentType==='investissement'?'':''}<span class="code-tag">${l.nature}</span></td>
      <td style="font-size:.78rem;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l.libelleNature}">${l.libelleNature}</td>
      <td style="font-size:.76rem;color:var(--gray)">${l.libelleAntenne||'—'}</td>
      <td class="amt pos">${fmt(l.budget)}</td>
      <td class="amt" style="color:#8a5c00">${l.ens?fmt(l.ens):'—'}</td>
      <td class="amt pos">${l.mandate?fmt(l.mandate):'—'}</td>
      <td class="amt ${l.disponible<0?'neg':'pos'}">${fmt(l.disponible)}</td>
      <td><div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:${Math.min(pct*100,100)}%;background:${color}"></div></div><span class="prog-pct" style="color:${color}">${pctD}%</span></div></td>
      <td>${l.subvention?`<span style="color:var(--success);font-weight:700">${fmt(l.subvention)}</span>`:'—'}</td>
      <td class="comment-cell ${com?'':'empty'}" onclick="openLineModal('${l.id}')" title="${com}">${com||'+'}</td>
      <td><button style="background:none;border:none;cursor:pointer;color:var(--gray);padding:2px 4px;border-radius:4px" onclick="openLineModal('${l.id}')">✏️</button></td>
    </tr>`;
  }).join('');
}

function renderGlobalStats() {
  const tb = filtered.reduce((s,l)=>s+l.budget,0);
  const tr = filtered.reduce((s,l)=>s+l.realise,0);
  const tm = filtered.reduce((s,l)=>s+l.mandate,0);
  const te = filtered.reduce((s,l)=>s+l.ens,0);
  const ts = filtered.reduce((s,l)=>s+(l.subvention||0),0);
  const pct = tb>0?Math.round(tr/tb*100):0;
  document.getElementById('global-stats').innerHTML = `
    <div class="stat-card"><div class="label">Budget</div><div class="value">${fmt(tb)}</div><div class="sub">${filtered.filter(l=>l.budget>0).length} lignes actives</div></div>
    <div class="stat-card"><div class="label">Réalisé</div><div class="value" style="color:var(--accent)">${fmt(tr)}</div><div class="sub">${pct}% du budget</div></div>
    <div class="stat-card"><div class="label">Mandaté</div><div class="value" style="color:var(--success)">${fmt(tm)}</div></div>
    <div class="stat-card"><div class="label">ENS</div><div class="value" style="color:#8a5c00">${fmt(te)}</div></div>
    <div class="stat-card"><div class="label">Disponible</div><div class="value" style="color:${tb-tr<0?'var(--danger)':'var(--primary)'}">${fmt(tb-tr)}</div></div>
    ${ts?`<div class="stat-card"><div class="label">Subventions</div><div class="value" style="color:var(--success)">${fmt(ts)}</div></div>`:''}
  `;
}

              </tr>`;
            }).join('')}</tbody>
          </table>
          ${withComment.length?`<div style="margin-top:12px"><div style="font-size:.72rem;font-weight:700;color:var(--gray);margin-bottom:5px">NOTES</div>${withComment.map(l=>`<div style="font-size:.8rem;padding:5px 9px;background:#f5f8ff;border-radius:5px;margin-bottom:3px"><strong>${l.libelleNature} — ${l.libelleAntenne}</strong><br>${l.comment}${l.echeance?`<br><span style="color:var(--accent)">📅 ${l.echeance}</span>`:''}</div>`).join('')}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleGrp(id) {
  const el=document.getElementById(id), icon=document.getElementById(id+'_icon');
  if(el.style.display==='none'){el.style.display='block';icon.textContent='▴';}
  else{el.style.display='none';icon.textContent='▾';}
}

// ─── STATS TAB ────────────────────────────────────────────────────────────
function renderStatsTab() {
  const tb=allLines.reduce((s,l)=>s+l.budget,0), tr=allLines.reduce((s,l)=>s+l.realise,0);
  const tm=allLines.reduce((s,l)=>s+l.mandate,0), te=allLines.reduce((s,l)=>s+l.ens,0);
  document.getElementById('stats-global').innerHTML = `
    <div class="stat-card"><div class="label">Budget total</div><div class="value">${fmt(tb)}</div><div class="sub">${allLines.filter(l=>l.budget>0).length} lignes actives / ${allLines.length} total</div></div>
    <div class="stat-card"><div class="label">Réalisé</div><div class="value" style="color:var(--accent)">${fmt(tr)}</div><div class="sub">${tb>0?Math.round(tr/tb*100):0}%</div></div>
    <div class="stat-card"><div class="label">Mandaté</div><div class="value" style="color:var(--success)">${fmt(tm)}</div></div>
    <div class="stat-card"><div class="label">ENS</div><div class="value" style="color:#8a5c00">${fmt(te)}</div></div>
    <div class="stat-card"><div class="label">Disponible</div><div class="value" style="color:${tb-tr<0?'var(--danger)':'var(--primary)'}">${fmt(tb-tr)}</div></div>
  `;

  const grps={};
  allLines.forEach(l=>{
    const k=getGrpKey(l);
    if(!grps[k]) grps[k]={key:k,label:getGrpLabel(l),budget:0,realise:0,mandate:0,ens:0,dispo:0};
    grps[k].budget+=l.budget; grps[k].realise+=l.realise; grps[k].mandate+=l.mandate;
    grps[k].ens+=l.ens; grps[k].dispo+=l.disponible;
  });

  const isInvest = currentType === 'investissement';
  document.getElementById('stats-thead').innerHTML = `<tr>
    <th>Code</th><th>${isInvest?'Opération':'Chapitre'}</th>
    <th style="text-align:right">Budgété</th><th style="text-align:right">ENS</th>
    <th style="text-align:right">Mandaté</th><th style="text-align:right">Réalisé</th>
    <th style="text-align:right">Disponible</th><th>Avancement</th>
  </tr>`;

  document.getElementById('stats-ops-body').innerHTML = Object.values(grps).sort((a,b)=>a.key>b.key?1:-1).map(g=>{
    const pct=g.budget>0?Math.min(g.realise/g.budget,1.5):(g.realise>0?1.5:0);
    const pctD=g.budget>0?Math.round(g.realise/g.budget*100):(g.realise>0?'∞':0);
    const color=pColor(g.budget>0?g.realise/g.budget:(g.realise>0?999:0));
    return `<tr>
      <td><span class="code-tag">${g.key}</span></td>
      <td style="font-weight:600">${g.label}</td>
      <td class="amt">${fmt(g.budget)}</td>
      <td class="amt" style="color:#8a5c00">${fmt(g.ens)}</td>
      <td class="amt pos">${fmt(g.mandate)}</td>
      <td class="amt ${g.realise>g.budget?'neg':'pos'}">${fmt(g.realise)}</td>
      <td class="amt ${g.dispo<0?'neg':'pos'}">${fmt(g.dispo)}</td>
      <td><div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:${Math.min(pct*100,100)}%;background:${color}"></div></div><span class="prog-pct" style="color:${color}">${pctD}%</span></div></td>
    </tr>`;
  }).join('');
}

// ─── TABS ─────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.getElementById('tab-lignes').style.display=tab==='lignes'?'block':'none';
  document.getElementById('tab-operations').style.display=tab==='operations'?'block':'none';
  document.getElementById('tab-stats').style.display=tab==='stats'?'block':'none';
  if(tab==='operations') renderOpsTab();
  if(tab==='stats') renderStatsTab();
}

// ─── ANNOTATION MODAL ─────────────────────────────────────────────────────
function openLineModal(id) {
  editId=id;
  const l=allLines.find(x=>x.id===id);
  if(!l) return;
  const isInvest=currentType==='investissement';
  document.getElementById('line-modal-info').innerHTML =
    `<strong>${isInvest?l.operation+' — '+l.libelleOperation:l.chapitre+' — '+l.libelleChapitre}</strong><br>`+
    `Nature ${l.nature} : ${l.libelleNature}<br>`+
    `Site : ${l.libelleAntenne||'—'} · Budget : ${fmt(l.budget)} · Réalisé : ${fmt(l.realise)} · Disponible : ${fmt(l.disponible)}`;
  document.getElementById('line-subvention').value=l.subvention||'';
  document.getElementById('line-financeur').value=l.financeur||'';
  document.getElementById('line-comment').value=l.comment||'';
  document.getElementById('line-echeance').value=l.echeance||'';
  document.getElementById('line-modal').style.display='flex';
}
function closeLineModal() { document.getElementById('line-modal').style.display='none'; }

function saveLine() {
  const data={
    comment:document.getElementById('line-comment').value.trim(),
    subvention:parseFloat(document.getElementById('line-subvention').value)||0,
    financeur:document.getElementById('line-financeur').value.trim(),
    echeance:document.getElementById('line-echeance').value.trim(),
  };
  annotations[editId]={...annotations[editId],...data};
  saveAnnots();
  const idx=allLines.findIndex(l=>l.id===editId);
  if(idx>=0) allLines[idx]={...allLines[idx],...data};
  closeLineModal();
  applyFilters();
  showNotif('Annotation enregistrée','success');
}

// ─── IMPORT ───────────────────────────────────────────────────────────────
function showImportModal() {
  importedLines=null;
  document.getElementById('import-status').textContent='';
  document.getElementById('import-confirm-btn').style.display='none';
  document.getElementById('import-file').value='';
  setImportType(currentType);
  document.getElementById('import-modal').style.display='flex';
}
function closeImportModal() { document.getElementById('import-modal').style.display='none'; }
function setImportType(type) {
  importType=type;
  document.getElementById('imp-type-invest').className='btn btn-sm '+(type==='investissement'?'btn-primary':'btn-outline');
  document.getElementById('imp-type-fonct').className='btn btn-sm '+(type==='fonctionnement'?'btn-primary':'btn-outline');
}

function handleImportFile(e) {
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=ev=>parseXLS(ev.target.result,importType); r.readAsText(file);
}

function parseXLS(text, type) {
  try {
    const doc=new DOMParser().parseFromString(text,'application/xml');
    const rows=doc.querySelectorAll('Row');
    const lines=[];
    let isFirst=true;
    rows.forEach(row=>{
      if(isFirst){isFirst=false;return;}
      const cells=row.querySelectorAll('Cell');
      const v=[...cells].map(c=>{const d=c.querySelector('Data');return d?d.textContent:'';});
      while(v.length<29)v.push('');
      const n=x=>{try{return Math.round(parseFloat(x||'0')*100)/100;}catch(e){return 0;}};
      if(type==='investissement') {
        const op=v[4].trim(); if(!op||op==='TOTAL:') return;
        lines.push({
          id:`${v[4].trim()}_${v[2].trim()}_${v[8].trim()}`, type:'investissement',
          operation:v[4].trim(),libelleOperation:v[5].trim(),nature:v[2].trim(),libelleNature:v[3].trim(),
          fonction:v[0].trim(),libelleFonction:v[1].trim(),service:v[6].trim(),
          antenne:v[8].trim(),libelleAntenne:v[9].trim(),
          budget:n(v[10]),realise:n(v[11]),mandate:n(v[19]),ens:n(v[20]),disponible:n(v[14]),exercice:v[22].trim(),
        });
      } else {
        if(!v[4].trim()&&!v[14].trim()) return;
        const g=v[0].trim(),nat=v[4].trim(),op=v[6].trim(),ant=v[10].trim();
        const opLib=v[7].trim()==="PAS D'OPERATION"?'':v[7].trim();
        lines.push({
          id:`F_${g}_${nat}_${op}_${ant}`, type:'fonctionnement',
          gestionnaire:g,libelleGestionnaire:v[1].trim(),
          fonction:v[2].trim(),libelleFonction:v[3].trim(),nature:nat,libelleNature:v[5].trim(),
          operation:op,libelleOperation:opLib,service:v[8].trim(),
          antenne:ant,libelleAntenne:v[11].trim(),chapitre:v[12].trim(),libelleChapitre:v[13].trim(),
          budget:n(v[14]),realise:n(v[15]),encours:n(v[18]),disponible:n(v[19]),mandate:n(v[24]),ens:n(v[25]),exercice:v[27].trim(),
        });
      }
    });
    importedLines={lines,type};
    document.getElementById('import-status').innerHTML=`<span style="color:var(--success)">✅ ${lines.length} lignes (${type}) détectées.</span>`;
    document.getElementById('import-confirm-btn').style.display='inline-flex';
  } catch(e) {
    document.getElementById('import-status').innerHTML=`<span style="color:var(--danger)">❌ Erreur: ${e.message}</span>`;
  }
}

function confirmImport() {
  if(!importedLines) return;
  if(importedLines.type===currentType) { applyType(currentType); }
  closeImportModal();
  showNotif(`${importedLines.lines.length} lignes importées`,'success');
}

// ─── UTILS ────────────────────────────────────────────────────────────────
function showNotif(msg,type='') {
  const el=document.createElement('div'); el.className='notif '+type; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3000);
}

document.getElementById('import-modal').querySelector('.import-area').addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.classList.add('drag-over');});
document.getElementById('import-modal').querySelector('.import-area').addEventListener('dragleave',e=>e.currentTarget.classList.remove('drag-over'));
document.getElementById('import-modal').querySelector('.import-area').addEventListener('drop',e=>{
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  const file=e.dataTransfer.files[0];
  if(file){const r=new FileReader();r.onload=ev=>parseXLS(ev.target.result,importType);r.readAsText(file);}
});

initPin();
</script>
