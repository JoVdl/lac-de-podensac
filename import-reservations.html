function log(msg, cls='') {
  const div = document.getElementById('log');
  div.innerHTML += `<div class="${cls}">${msg}</div>`;
  div.scrollTop = div.scrollHeight;
}

async function startImport() {
  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = 'Import en cours...';

  const user = firebase.auth().currentUser;
  if (!user) {
    alert('Vous devez être connecté à la page admin d\'abord !');
    btn.disabled = false;
    return;
  }

  let ok = 0, err = 0;
  const total = RESERVATIONS.length;

  for (let i = 0; i < RESERVATIONS.length; i++) {
    const r = RESERVATIONS[i];
    try {
      await db.collection('reservations').add({
        ...r,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        importedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      ok++;
    } catch(e) {
      err++;
      log(`❌ Erreur: ${r.nom} (${r.dateDebut}) — ${e.message}`, 'err');
    }

    if (i % 50 === 0 || i === total - 1) {
      document.getElementById('progress').textContent = `${i+1} / ${total} — ✅ ${ok} importées, ❌ ${err} erreurs`;
      await new Promise(r => setTimeout(r, 10));
    }
  }

  log(`<br><strong>Import terminé : ${ok} réservations importées, ${err} erreurs.</strong>`, ok > 0 ? 'ok' : 'err');
  btn.textContent = 'Import terminé ✓';
}
</script>
