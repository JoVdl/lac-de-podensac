let existingRes = [];
let dupFlags = [];
let loaded = false;
let PARSED_DATA = null; // remplace IMPORT_DATA si fichier chargé

function getCurrentData(){ return PARSED_DATA || IMPORT_DATA; }

// ── Parseur HTML de réservations ───────────────────────────────
const MONTHS_FR = {jan:1,janv:1,'fév':2,'févr':2,mars:3,avr:4,mai:5,juin:6,juil:7,juill:7,'aoû':8,'août':8,sep:9,sept:9,oct:10,nov:11,'déc':12};
function parseFrDate(s){
  const m = s.toLowerCase().match(/(\d+)\s+([a-zéèêëàâûùüîïôœç]+)\.?\s+(\d{4})/);
  if(!m) return null;
  const month = MONTHS_FR[m[2].replace('.','')];
  if(!month) return null;
  return `${m[3]}-${String(month).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
}
function parseDates(cell){
  const parts = cell.split(/\.{2,}/);
  if(parts.length===2) return [parseFrDate(parts[0]), parseFrDate(parts[1])];
  const d = parseFrDate(cell); return [d,d];
}
function parseMoney(cell,key){
  const m = cell.match(new RegExp(key+':\\s*([\\d\\s]+)€'));
  return m ? parseFloat(m[1].replace(/\s/g,''))||0 : 0;
}
function parsePax(cell){
  const a=cell.match(/Adultes:\s*(\d+)/), e=cell.match(/Enfants:\s*(\d+)/);
  return [a?parseInt(a[1]):0, e?parseInt(e[1]):0];
}
function parseName(cell){
  const name = cell.replace(/\+.*$/,'').trim().split(/\s+/);
  if(name.length>=2) return [name[0].charAt(0).toUpperCase()+name[0].slice(1).toLowerCase(), name.slice(1).join(' ').toUpperCase()];
  return [name[0]||'',''];
}
const POSTE_MAP = {'poste 1':1,'poste 2':2,'poste 3':3,'poste 4':4,'poste 5':5,'poste 6':6,'poste 7':7,'poste 8':8,'poste de la cale':9,'poste des iris':10,'ponton des gardiens':6};
function mapPoste(a){
  const al = a.toLowerCase();
  for(const[k,v] of Object.entries(POSTE_MAP)) if(al.includes(k)) return v;
  const m = al.match(/poste\s+(\d+)/); return m?parseInt(m[1]):null;
}
function detectType(a){
  const al = a.toLowerCase();
  if(/camping\s*-?\s*car|emplacement/.test(al)) return 'campingcar';
  if(/tente/.test(al)) return 'tente';
  if(/canoe|canoë|kayak/.test(al)) return 'canoe';
  return 'peche';
}
function daysBetween(d1,d2){ return Math.max(1,Math.round((new Date(d2)-new Date(d1))/86400000)); }
function makeDates(start,n){ return Array.from({length:n},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10);}); }

function parseResHTML(html){
  const parser = new DOMParser();
  const doc = parser.parseFromString(html,'text/html');
  const rows = [...doc.querySelectorAll('tr')].filter(tr=>tr.querySelectorAll('td').length===8);
  const results = [];
  for(const tr of rows){
    const cells = [...tr.querySelectorAll('td')].map(td=>td.innerText||td.textContent||'');
    const [dateCell,,actCell,nameCell,paxCell,,priceCell,noteCell] = cells;
    const [dateDebut,dateFin] = parseDates(dateCell);
    if(!dateDebut||!dateFin) continue;
    const type = detectType(actCell);
    const [prenom,nom] = parseName(nameCell);
    const [adultes,enfants] = parsePax(paxCell);
    const totalPrice = parseMoney(priceCell,'Prix')||null;
    const avance = parseMoney(priceCell,'Avance')||null;
    const resteAPayer = parseMoney(priceCell,'Reste')||null;
    const duree = daysBetween(dateDebut,dateFin);
    const r = {type,status:'confirmed',prenom,nom,dateDebut,dateFin,duree,dates:makeDates(dateDebut,duree),source:'import-manuel'};
    if(adultes) r.adultes=adultes;
    if(enfants) r.enfants=enfants;
    if(totalPrice) r.totalPrice=totalPrice;
    if(avance) r.avance=avance;
    if(resteAPayer) r.resteAPayer=resteAPayer;
    const note=(noteCell||'').trim(); if(note) r.message=note;
    if(type==='peche'){
      const al=actCell.toLowerCase();
      if(/carnassier/.test(al)){ r.posteId='zone-carnassier'; r.activity='carnassier'; }
      else r.posteId=mapPoste(actCell);
      r.formule='nuit'; r.nb=adultes||1;
      if(/\+barque/.test(nameCell.toLowerCase())){ r.barque=true; const m=nameCell.match(/barque\s*(\d)/i); if(m)r.barqueNum=parseInt(m[1]); }
    } else if(type==='campingcar'){
      if(totalPrice&&duree) r.tarifNuit=Math.round(totalPrice/duree*100)/100;
    } else if(type==='canoe'){
      r.nb=adultes||1;
    }
    results.push(r);
  }
  return results;
}

async function loadFile(input){
  const file = input.files[0];
  if(!file) return;
  document.getElementById('file-name').textContent = '⏳ Lecture…';
  const html = await file.text();
  PARSED_DATA = parseResHTML(html);
  document.getElementById('file-name').textContent = `✅ ${file.name} — ${PARSED_DATA.length} réservations trouvées`;
  if(loaded) refreshDups();
  else await init();
}

function refreshDups(){
  const data = getCurrentData();
  dupFlags = data.map(r => isDuplicate(r, existingRes));
  const nDup = dupFlags.filter(Boolean).length;
  const nNew = dupFlags.filter(x=>!x).length;
  const nCarn = data.filter(r => r.activity==='carnassier'||r.posteId==='zone-carnassier').length;
  const nCC   = data.filter(r => r.type==='campingcar').length;
  const nPeche= data.filter(r => r.type==='peche' && r.activity!=='carnassier' && r.posteId!=='zone-carnassier').length;
  const nCanoe= data.filter(r => r.type==='canoe').length;
  document.getElementById('summary').innerHTML =
    '<b>'+data.length+' réservations à importer</b> — '+
    '<span style="color:#2a6059">'+nNew+' nouvelles</span> · '+
    '<span style="color:#c06000">'+nDup+' doublons potentiels</span> · '+
    existingRes.length+' déjà dans Firestore';
  document.getElementById('type-counts').textContent =
    '🐟 Carnassier: '+nCarn+' · 🎣 Pêche postes: '+nPeche+' · 🚐 Camping-car: '+nCC+' · 🛶 Canoë: '+nCanoe;
  document.getElementById('btn-import').disabled = false;
  document.getElementById('btn-import-all').disabled = false;
  document.getElementById('btn-import-carn').disabled = false;
  renderTable();
}

function normalize(s){ return (s||'').toLowerCase().replace(/[\s\-_]/g,'').normalize('NFD').replace(/[̀-ͯ]/g,''); }

function isDuplicate(r, existing){
  const rNom = normalize(r.nom + r.prenom);
  const rDate = r.dateDebut;
  const rIsCarnassier = r.activity === 'carnassier' || r.posteId === 'zone-carnassier';
  return existing.some(e => {
    if(e.type !== r.type) return false;
    const eDate = e.dateDebut || e.date || '';
    if(eDate !== rDate) return false;
    // Pour la pêche, distinguer carnassier des postes normaux
    if(r.type === 'peche') {
      const eIsCarnassier = e.activity === 'carnassier' || e.posteId === 'zone-carnassier';
      if(rIsCarnassier !== eIsCarnassier) return false;
      // Même poste ? (pour les postes normaux)
      if(!rIsCarnassier && r.posteId && e.posteId && r.posteId !== e.posteId) return false;
    }
    const eNom = normalize((e.nom||'')+(e.prenom||''));
    if(rNom.length < 3 || eNom.length < 3) return rNom === eNom;
    return rNom.includes(eNom.slice(0,4)) || eNom.includes(rNom.slice(0,4));
  });
}

async function init(){
  try {
    const snap = await db.collection('reservations').get();
    existingRes = snap.docs.map(d=>({id:d.id,...d.data()}));
    loaded = true;
    refreshDups();
  } catch(e){
    document.getElementById('summary').textContent = '❌ Erreur Firebase: '+e.message;
  }
}

function renderTable(filterText='', showOnlyDups=false, hideDups=false){
  const ft = normalize(filterText);
  const rows = getCurrentData().map((r,i)=>({r,i,dup:dupFlags[i]})).filter(({r,i,dup})=>{
    if(showOnlyDups && !dup) return false;
    if(hideDups && dup) return false;
    const detail2 = r.activity==='carnassier'?'carnassier':(r.posteId?String(r.posteId):'');
    if(ft && !normalize(r.nom+r.prenom).includes(ft) && !normalize(r.dateDebut).includes(ft) && !normalize(detail2).includes(ft)) return false;
    return true;
  });

  const tb = document.getElementById('tbody');
  tb.innerHTML = rows.map(({r,i,dup})=>{
    const isCarnassier = r.activity==='carnassier' || r.posteId==='zone-carnassier';
    const badgeClass = isCarnassier ? 'carnassier' : r.type;
    const typeLabel = isCarnassier ? '🐟 Carnassier' : ({peche:'🎣 Pêche',campingcar:'🚐 CC',canoe:'🛶 Canoë'}[r.type]||r.type);
    const detail = r.type==='peche' ? (isCarnassier?'Zone carnassier':'Poste '+r.posteId) : (r.type==='campingcar'?r.duree+' nuit(s)':'');
    const prix = r.totalPrice ? r.totalPrice+'€' : '—';
    const dupBadge = dup ? '<span style="color:#c06000;font-size:.7rem;">⚠️ doublon?</span>' : '<span style="color:#2a6059;font-size:.7rem;">✓ nouveau</span>';
    return '<tr class="'+(dup?'dup':'new')+'" data-idx="'+i+'">'+
      '<td>'+r.dateDebut+'</td>'+
      '<td>'+r.dateFin+'</td>'+
      '<td><span class="badge '+badgeClass+'">'+typeLabel+'</span></td>'+
      '<td>'+r.prenom+' '+r.nom+'</td>'+
      '<td>'+detail+'</td>'+
      '<td>'+prix+'</td>'+
      '<td>'+dupBadge+'</td>'+
    '</tr>';
  }).join('');
}

function applyFilter(){
  const ft = document.getElementById('filter').value;
  const showDups = document.getElementById('show-dups').checked;
  const hideDups = document.getElementById('hide-dups').checked;
  renderTable(ft, showDups, hideDups);
}

async function doImport(importAll=false){
  const toImport = getCurrentData().filter((_,i) => importAll || !dupFlags[i]);
  if(!toImport.length){ document.getElementById('status').textContent = 'Rien à importer.'; return; }
  
  document.getElementById('btn-import').disabled = true;
  document.getElementById('btn-import-all').disabled = true;
  document.getElementById('progress').style.display = '';
  const statusEl = document.getElementById('status');
  let done = 0, errors = 0;

  for(let start=0; start<toImport.length; start+=400){
    const batch = db.batch();
    const chunk = toImport.slice(start, start+400);
    for(const r of chunk){
      const ref = db.collection('reservations').doc();
      batch.set(ref, {...r, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    }
    try {
      await batch.commit();
      done += chunk.length;
    } catch(e) {
      errors += chunk.length;
      statusEl.textContent = '❌ Erreur: '+e.message;
    }
    document.getElementById('progress-bar').style.width = Math.round(done/toImport.length*100)+'%';
    statusEl.textContent = '⏳ '+done+'/'+toImport.length+' importés…';
  }
  statusEl.textContent = '✅ Import terminé: '+done+' réservations ajoutées'+(errors?' · ❌ '+errors+' erreurs':'');
}

async function doImportAll(){ doImport(true); }

async function doImportCarnassier(){
  const toImport = getCurrentData().filter(r => r.activity==='carnassier' || r.posteId==='zone-carnassier');
  if(!toImport.length){ document.getElementById('status').textContent = 'Aucun carnassier trouvé.'; return; }
  document.getElementById('btn-import-carn').disabled = true;
  const statusEl = document.getElementById('status');
  statusEl.textContent = '⏳ Import de '+toImport.length+' carnassier…';
  document.getElementById('progress').style.display = '';
  let done = 0, errors = 0;
  for(let start=0; start<toImport.length; start+=400){
    const batch = db.batch();
    for(const r of toImport.slice(start, start+400)){
      batch.set(db.collection('reservations').doc(), {...r, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    }
    try { await batch.commit(); done += Math.min(400, toImport.length-start); }
    catch(e){ errors++; statusEl.textContent = '❌ '+e.message; }
    document.getElementById('progress-bar').style.width = Math.round(done/toImport.length*100)+'%';
  }
  statusEl.textContent = '✅ '+done+' carnassier importés'+(errors?' · ❌ '+errors+' erreurs':'');
}
